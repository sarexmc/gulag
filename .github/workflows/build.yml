name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Instala Gradle directamente: no hace falta gradlew ni gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compilar
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: smaash-gulag-camera-fabric-1.21.1
          path: build/libs/*.jar
